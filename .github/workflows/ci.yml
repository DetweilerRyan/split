# Runs AGENTS.md's definition-of-done checks. Reasons for this layout are in
# docs/engineering/ci.meta.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Definition of done
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # Must match the `playwright` version in package.json exactly; update them together.
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
